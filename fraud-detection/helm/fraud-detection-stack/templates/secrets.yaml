{{- if .Values.fraudDetection.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: fraud-detection-secrets
  namespace: {{ .Values.namespace | quote }}
  labels:
    app: fraud-detection
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  # MySQL credentials
  MYSQL_HOST: {{ printf "mysql.%s.svc.cluster.local" .Values.namespace | b64enc | quote }}
  MYSQL_PORT: {{ "3306" | b64enc | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.auth.database | b64enc | quote }}
  MYSQL_USER: {{ .Values.mysql.auth.username | b64enc | quote }}
  MYSQL_PASSWORD: {{ .Values.mysql.auth.password | b64enc | quote }}
  
  # Kafka configuration for internal Kubernetes DNS
  KAFKA_BOOTSTRAP_SERVERS: {{ printf "kafka.%s.svc.cluster.local:9092" .Values.namespace | b64enc | quote }}
  KAFKA_ADVERTISED_LISTENERS: {{ printf "PLAINTEXT://kafka.%s.svc.cluster.local:9092" .Values.namespace | b64enc | quote }}
  KAFKA_BROKER_ENDPOINT: {{ printf "kafka.%s.svc.cluster.local:9092" .Values.namespace | b64enc | quote }}
  
  # Spring application properties
  SPRING_DATASOURCE_URL: {{ printf "jdbc:mysql://mysql.%s.svc.cluster.local:3306/%s" .Values.namespace .Values.mysql.auth.database | b64enc | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.mysql.auth.username | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.mysql.auth.password | b64enc | quote }}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ printf "kafka.%s.svc.cluster.local:9092" .Values.namespace | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-config
  namespace: {{ .Values.namespace | quote }}
  labels:
    app: fraud-detection
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SERVER_PORT: "8081"
  LOGGING_LEVEL_COM_GMB: "INFO"
  LOGGING_LEVEL_ROOT: "WARN"

  # JPA/Hibernate configuration
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"

  # Kafka consumer configuration
  SPRING_KAFKA_CONSUMER_GROUP_ID: "fraud-detection-group"
  SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: "earliest"

  # Kafka topics
  APP_KAFKA_TOPICS_TRANSACTION_EVALUATED: "transaction-evaluated"
  APP_KAFKA_TOPICS_TRANSACTION_STATUS_UPDATED: "transaction-status-updated"
  APP_KAFKA_TOPICS_CUSTOMER_ACTION_RECEIVED: "customer-action-received"

  # Metrics and monitoring
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,prometheus"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
{{- end }}

