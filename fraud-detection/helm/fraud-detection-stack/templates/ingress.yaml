apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-detection-ingress
  namespace: fraud-detection
spec:
  rules:
    - host: fraud-detection.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fraud-detection
                port:
                  number: 8081
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: mysql.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mysql
                port:
                  number: 3306
    - host: zookeeper.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zookeeper
                port:
                  number: 2181

